<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping List | Yellow Mango! </title>
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body>  
         <header>
            <h1>Yellow Mango! </h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html" >Recipes</a></li>
                    <li><a href="planner.html">Meal Planner</a></li>
                    <li><a href="shopping.html" aria-current="page">Shopping List</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="weekly-meals">
                <h2>Your shopping list</h2>
                <p>Check off ingredients as you shop.</p>
                <!--Mark is in the shopping introduction to highlight a reminder to users to check for exisiting ingredients-->
                <p><mark>Before you shop:</mark> Check what you have in your fridge. </p>

                <form action="shopping.html" method="get">
                    <label for="shopping-item">Items to buy</label>


                    <!--Required and Maxlength are HTML attributes located on the "Item to buy" input in the shopping form. I use required to prevent empty submissions and maxlength="40" to limit item names to 40 characters.-->
                    <input 
                        type="text"
                        id="shopping-item"
                        name="item"
                        placeholder="Example: Apples"
                        
                        required maxlength="40"
                    >
                    <!--No functionality for submit button-->
                    <button type="submit"> Submit item</button>
                </form>

                <!--Draggable is an HTML attribute located on each <li> in the shopping list item below. Setting draggable="true" allows users to drag the ingredient items. Reordering requires JS-->
                <ul class="shopping-items">
                    <li draggable="true"><label><input type="checkbox">Yogurt</label></li>
                    <li draggable="true"><label><input type="checkbox">Granola</label></li>
                    <li draggable="true"><label><input type="checkbox">Bread</label></li>
                    <li draggable="true"><label><input type="checkbox">Lettuce</label></li>
                    <li draggable="true"><label><input type="checkbox">Tomatoes</label></li>
                    <li draggable="true"><label><input type="checkbox">Salmon</label></li>
                    <li draggable="true"><label><input type="checkbox">Carrots</label></li>
                    <li draggable="true"><label><input type="checkbox">Broccoli</label></li>
                </ul>
            </section>
        </main>
            
        <footer>
            <p>For more information, contact us at: </p>
            <!--The address element tells the browser that the text provides contact information for the Website.-->
            <address>
                <a href="mailto:hello@yellowmango.com">hello@yellowmango.com</a><br/>
                <a href="tel: 111-222-3333">+ (111)-222-3333</a>
            </address>
        </footer>
    </body>
</html>
